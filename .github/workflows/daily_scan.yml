name: Market Scanner - Install Test (manual)

# This gives you a "Run workflow" button in Actions -> your repo -> workflows
on:
  workflow_dispatch:

jobs:
  test-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Do not need API keys for install test
      # Provide dummy secrets if the step requires env variables later
      GENAI_API_KEY: ${{ secrets.GENAI_API_KEY }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Show Python & pip versions
        run: |
          python -V
          python -m pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --upgrade google-generativeai


      - name: Verify pandas-ta import (debug)
        run: |
          python - <<'PY'
          try:
              import pandas_ta as ta
              print("pandas_ta imported, version:", getattr(ta, "__version__", "unknown"))
          except Exception as e:
              print("pandas_ta import failed:", e)
          try:
              import pandas as pd
              print("pandas version:", pd.__version__)
          except Exception as e:
              print("pandas import failed:", e)
          PY
