name: Debug Secrets

on: workflow_dispatch

jobs:
  debug-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Check Environment Variables
        env:
          GENAI_API_KEY: ${{ secrets.GENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        run: |
          echo "--- DEBUGGING KEYS ---"
          
          if [ -z "$GENAI_API_KEY" ]; then
            echo "❌ GENAI_API_KEY is EMPTY or MISSING"
          else
            echo "✅ GENAI_API_KEY is FOUND (Length: ${#GENAI_API_KEY} characters)"
          fi

          if [ -z "$EMAIL_SENDER" ]; then
            echo "❌ EMAIL_SENDER is EMPTY or MISSING"
          else
            echo "✅ EMAIL_SENDER is FOUND: $EMAIL_SENDER"
          fi
